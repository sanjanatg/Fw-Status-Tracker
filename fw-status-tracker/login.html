<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login – FW Status Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>
  /* ── Login page specific ── */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    z-index: 2;
  }
  .login-card {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1.5px solid rgba(255,255,255,0.13);
    border-radius: 20px;
    padding: 48px 44px 42px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.22);
  }
  .login-logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .login-logo .org-badge {
    display: inline-block;
    margin-bottom: 10px;
  }
  .login-logo h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    color: var(--text);
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }
  .login-logo p {
    font-size: 0.82rem;
    color: var(--muted);
    margin: 0;
  }
  .login-divider {
    height: 1.5px;
    background: linear-gradient(90deg, transparent, rgba(14,127,168,0.4), transparent);
    margin: 20px 0 28px;
  }
  .login-field {
    margin-bottom: 18px;
  }
  .login-field label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  .login-field-wrap {
    position: relative;
  }
  .login-field input {
    width: 100%;
    padding: 11px 44px 11px 14px;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(22, 21, 21, 0.76);
    border-radius: 10px;
    color: var(--text);
    font-size: 0.93rem;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    box-sizing: border-box;
  }
  .login-field input:focus {
    border-color: var(--accent);
    background: rgba(14, 127, 168, 0.205);
  }
  .login-field input::placeholder { color: rgba(3, 3, 3, 0.74); }
  .toggle-pw {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    display: flex;
    align-items: center;
    padding: 2px;
    transition: color 0.15s;
  }
  .toggle-pw:hover { color: var(--accent); }
  .login-error {
    display: none;
    background: rgba(220,53,69,0.13);
    border: 1px solid rgba(220,53,69,0.35);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.82rem;
    color: #f87171;
    margin-bottom: 16px;
    text-align: center;
  }
  .login-error.show { display: block; }
  .login-attempts {
    font-size: 0.75rem;
    color: #f87171;
    text-align: center;
    margin-bottom: 12px;
    display: none;
  }
  .login-attempts.show { display: block; }
  .btn-login {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.18s, transform 0.15s, box-shadow 0.15s;
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-login:hover:not(:disabled) {
    background: #0b6a91;
    transform: translateY(-1px);
    box-shadow: 0 4px 18px rgba(14,127,168,0.35);
  }
  .btn-login:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .login-lock-msg {
    display: none;
    text-align: center;
    font-size: 0.82rem;
    color: #f87171;
    margin-top: 14px;
  }
  .login-lock-msg.show { display: block; }
  .login-footer {
    text-align: center;
    margin-top: 22px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  @media (max-width: 480px) {
    .login-card { padding: 32px 22px 28px; }
  }
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-overlay"></div>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="org-badge">TATA Advanced Systems</div>
      <h2>FW Status Tracker</h2>
      <p></p>
    </div>
    <div class="login-divider"></div>

    <div class="login-error" id="loginError">Incorrect username or password. Please try again.</div>
    <div class="login-attempts" id="loginAttempts"></div>

    <div class="login-field">
      <label for="loginUser">Username</label>
      <div class="login-field-wrap">
        <input type="text" id="loginUser" placeholder="Enter your username" autocomplete="username" onkeydown="onLoginKey(event)"/>
      </div>
    </div>

    <div class="login-field">
      <label for="loginPass">Password</label>
      <div class="login-field-wrap">
        <input type="password" id="loginPass" placeholder="Enter your password" autocomplete="current-password" onkeydown="onLoginKey(event)"/>
        <button class="toggle-pw" type="button" onclick="togglePassword()" title="Show/hide password" id="togglePwBtn">
          <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Sign In
    </button>

    <div class="login-lock-msg" id="lockMsg"></div>

    <div class="login-footer">Secure access · TATA Advanced Systems</div>
  </div>
</div>

<script>
  const SESSION_KEY = 'tw_auth_session';

  fetch('/api/session', { credentials: 'same-origin' })
    .then(response => {
      if (response.ok) window.location.replace('/summary.html');
    })
    .catch(() => {});

  async function doLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value;
    if (!user || !pass) {
      showError('Please enter both username and password.');
      return;
    }
    const button = document.getElementById('loginBtn');
    button.disabled = true;
    document.getElementById('loginError').classList.remove('show');
    document.getElementById('lockMsg').classList.remove('show');
    try {
      const csrfResponse = await fetch('/api/csrf', { credentials: 'same-origin' });
      const csrf = await csrfResponse.json();
      if (!csrfResponse.ok) throw new Error(csrf.error || 'Could not start a secure login.');
      const response = await fetch('/api/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-Token': csrf.token
        },
        body: JSON.stringify({ username: user, password: pass })
      });
      const result = await response.json();
      if (!response.ok) {
        if (response.status === 429) showLockMsg(result.error);
        else showError(result.error || 'Sign-in failed.');
        return;
      }
      sessionStorage.setItem(SESSION_KEY, 'authenticated');
      window.location.replace('/summary.html');
    } catch (error) {
      showLockMsg(error.message || 'Unable to reach the tracker server.');
    } finally {
      document.getElementById('loginPass').value = '';
      if (!sessionStorage.getItem(SESSION_KEY)) {
        button.disabled = false;
        document.getElementById('loginPass').focus();
      }
    }
  }

  function showError(msg) {
    const el = document.getElementById('loginError');
    el.textContent = msg;
    el.classList.add('show');
  }
  function showAttempts(msg) {
    const el = document.getElementById('loginAttempts');
    el.textContent = msg;
    el.classList.add('show');
  }
  function showLockMsg(msg) {
    const el = document.getElementById('lockMsg');
    el.textContent = msg;
    el.classList.add('show');
  }

  function togglePassword() {
    const inp = document.getElementById('loginPass');
    const icon = document.getElementById('eyeIcon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>';
    } else {
      inp.type = 'password';
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>';
    }
  }

  function onLoginKey(e) {
    if (e.key === 'Enter') doLogin();
    // Clear error on typing
    document.getElementById('loginError').classList.remove('show');
  }

</script>
</body>
</html>
