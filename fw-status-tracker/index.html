<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FW Status Tracker – Project Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-overlay"></div>

<div class="page">

  <!-- HERO -->
 <!-- NEW STRUCTURAL DUP HEADER BLOCK FROM SUMMARY.HTML -->
<header class="summary-page-header unique-tracker-header">
  <div class="header-left-side">
    <div class="summary-kicker"><h1>TATA Advanced Systems</h1></div>
    <h2>Fw Status Tracker</h2>
    
    <!-- Action link customized for index.html to navigate backwards -->
    <div class="tracker-btn-wrapper">
      <button class="btn-summary-action btn-tracker" onclick="window.location.href='summary.html'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="transform: rotate(180deg); margin-right: 4px;">
          <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back to Summary
      </button>
    </div>
  </div>

  <!-- Logout button aligned to the far-right edge -->
  <button class="btn-summary-action btn-logout" onclick="doLogout()" title="Logout">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Logout
  </button>
</header>


  <div class="content">

    <!-- Top toolbar: New Entry, Choose Projects, Download Selected — all together, left-aligned, at the top -->
    
      <div>
        <button class="btn-add-project" onclick="addEntry()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
          New Entry
        </button>
      </div>
   

    <!-- Entry cards container (collapsed by default) -->
    <div id="entriesContainer"></div>

  </div>

  <!-- Bottom action bar -->
  <div class="bottom-bar">
    <div class="bottom-file-actions">
    </div>
    <button class="btn-bottom btn-save" onclick="saveData()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M17 21H7a4 4 0 0 1-4-4V7l4-4h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4Z" stroke="#fff" stroke-width="1.8"/>
        <path d="M9 21v-6h6v6M9 3v4h6V3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      Save Records
    </button>
  </div>

</div>

<div id="toast"></div>

<script src="storage.js"></script>
<script src="script.js"></script>
</body>
</html>
